[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsdp2"
version = "3.2.6"
description = "Tash Space Data Preprocessor: memory-aware FITS mosaicking and WCS alignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "astropy>=5.3",
  "reproject>=0.9",
]

[project.optional-dependencies]
previews = ["Pillow>=9"]
theme = ["sv-ttk>=2"]
security = ["keyring>=24"]
mast = ["astroquery>=0.4.7"]
system = ["psutil>=5.9"]
packaging = ["pyinstaller>=6.19"]
dev = ["pytest>=8", "pytest-cov>=5"]
all = [
  "Pillow>=9",
  "sv-ttk>=2",
  "keyring>=24",
  "astroquery>=0.4.7",
  "psutil>=5.9",
]

[project.scripts]
tsdp2 = "tsdp2.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tsdp2*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gui: requires a working Tk display",
  "integration: exercises multiple package layers",
]

[tool.coverage.run]
branch = true
source = ["tsdp2"]
